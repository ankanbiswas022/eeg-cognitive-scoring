# Default experiment configuration for the EEGMAT (PhysioNet) cognitive-load task.
data:
  raw_dir: data/raw/eegmat
  subject_info: data/raw/eegmat/subject-info.csv
  sfreq: 500            # native sampling rate of the EDF files
  resample_to: 250      # downsample after anti-alias filtering
  window_sec: 4.0       # analysis window length
  step_sec: 2.0         # hop between windows (50% overlap)
  eeg_channels_only: true
  drop_channels: ["ECG ECG"]
  rest_minutes_used: 1.0   # scored rest windows: the last 60 s of the 3-min rest (balances classes)
  baseline_seconds: 60     # calibration segment: first 60 s of the rest recording (never scored)

preprocess:
  l_freq: 1.0
  h_freq: 45.0
  notch: 50.0
  reference: average
  amplitude_reject_uv: 150.0      # window rejected if any channel exceeds this peak-to-peak (uV)
  flat_threshold_uv: 0.5          # channel considered flat if std below this

features:
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta:  [13, 30]
    gamma: [30, 45]
  multitaper_bandwidth: 2.0       # Hz, time-bandwidth product controls tapers
  aperiodic_fit_range: [2, 40]    # log-log linear fit for 1/f slope and offset
  connectivity_band: alpha
  baseline_relative: true         # z-score features against the subject's own calibration windows

models:
  classical:
    type: lightgbm                # or logreg
    n_estimators: 200
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 20
  deep:
    arch: eegnet                  # eegnet | tcn | gru
    epochs: 30
    batch_size: 64
    lr: 1.0e-3
    weight_decay: 1.0e-4
    seed: 7

validation:
  scheme: group_kfold             # subject-wise; never mixes a subject across folds
  n_splits: 6
  seed: 7

scoring:
  score_min: 0
  score_max: 100
  calibration: isotonic
  low_confidence_margin: 0.15     # |p-0.5| below this flags an uncertain window

monitoring:
  psi_warn: 0.1
  psi_alert: 0.25
  reference_path: artifacts/feature_reference.json

artifacts_dir: artifacts
